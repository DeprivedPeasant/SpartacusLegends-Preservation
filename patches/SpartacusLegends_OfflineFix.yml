PPU-81471d050c14f4d20b4027686f8b571dafd32394:

  "Spartacus Legends - Server emulator compatibility":
    Games:
      "Spartacus Legends":
        NPUB30746: [ 01.00 ]
    Author: "community RE (Ghidra + RPCS3 live debugging)"
    Notes: >
      Use with the local Spartacus Legends server emulator. The server
      produces a valid Quazal kerberos ticket, so the original ticket
      validator remains intact to decrypt the session key and secure-ticket
      blob into the caller's output buffer.

      The only executable change makes the outer online-flow completion gate
      accept backend state 0x19, which is reached after the full secure/title
      startup, instead of waiting forever for retail-only state 0x1a.

      Do not replace this function with `li r3,1; blr`: validation has a
      required decryption side effect. Returning at entry leaves the session
      key and secure ticket uninitialised, producing a 52-byte CONNECT with a
      zero-length ticket instead of the valid 88-byte CONNECT.

      Original gate bytes: 0x001a01e4 6863001A (xori r3,r3,0x1a)
    Patch Version: "3.0"
    Patch:
      - [ be32, 0x001a01e4, 0x68630019 ]  # accept completed local-server state

  "Spartacus Legends - Skip REMOTESERVERFAIL dialog":
    Games:
      "Spartacus Legends":
        NPUB30746: [ 01.00 ]
    Author: "community RE (Ghidra + RPCS3 live debugging)"
    Notes: >
      Superseded by the server-emulator approach - leave DISABLED unless
      running without tools/prudp_server.py. NOPs the dialog call at
      0x004f3638 so the "service is not available" popup is skipped. This
      only suppresses the message; the game still reaches the title screen
      and loops rather than entering the game.
    Patch Version: "2.0"
    Patch:
      - [ be32, 0x004f3638, 0x60000000 ]  # bl 0x0014a818 (show dialog) -> nop
